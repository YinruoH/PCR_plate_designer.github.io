    function setPlateView(type) {
      activePlateView = type === "rotated" ? "rotated" : "normal";
      syncPlateView();
    }

    function syncPlateView() {
      const normalWrap = document.getElementById("plateNormalWrap");
      const rotatedWrap = document.getElementById("plateRotatedWrap");
      const normalBtn = document.getElementById("normalViewBtn");
      const rotatedBtn = document.getElementById("rotatedViewBtn");

      if (normalWrap) normalWrap.classList.toggle("active", activePlateView === "normal");
      if (rotatedWrap) rotatedWrap.classList.toggle("active", activePlateView === "rotated");
      if (normalBtn) normalBtn.classList.toggle("active", activePlateView === "normal");
      if (rotatedBtn) rotatedBtn.classList.toggle("active", activePlateView === "rotated");
    }

    function downloadActivePlate(format) {
      downloadPlate(activePlateView, format);
    }

    function showGeneDropdown() {
      renderGeneDropdown(true);
    }

    function renderGeneDropdown(forceShow = true) {
      const box = document.getElementById("geneDropdown");
      const input = document.getElementById("geneInput");
      if (!box || !input) return;

      const keyword = String(input.value || "").trim().toLowerCase();
      const candidates = getGeneCandidates().filter(gene =>
        !keyword || gene.toLowerCase().includes(keyword)
      );

      if (!candidates.length) {
        box.innerHTML = `<div class="dropdown-empty">没有匹配项，可直接输入自定义基因名称</div>`;
      } else {
        box.innerHTML = candidates.map(gene => `
          <button type="button" class="dropdown-item"
                  onclick="selectGeneCandidate('${escapeJs(gene)}')">${escapeHtml(gene)}</button>
        `).join("");
      }

      if (forceShow) {
        box.classList.add("show");
      }
    }

    function selectGeneCandidate(gene) {
      const input = document.getElementById("geneInput");
      input.value = gene;
      document.getElementById("geneDropdown").classList.remove("show");
      input.focus();
    }

    function selectGeneFromCatalog(gene) {
      const input = document.getElementById("geneInput");
      const dropdown = document.getElementById("geneDropdown");
      if (!input) return;

      input.value = gene;
      if (dropdown) dropdown.classList.remove("show");

      // 点击左侧固定基因色块时，不主动 focus 输入框，
      // 避免 onfocus 再次弹出下拉列表遮挡下面的操作按钮。
    }

    document.addEventListener("pointerdown", event => {
      const input = document.getElementById("geneInput");
      const dropdown = document.getElementById("geneDropdown");
      if (!input || !dropdown) return;

      if (event.target !== input && !dropdown.contains(event.target)) {
        dropdown.classList.remove("show");
      }
    });

    function renderHistories() {
      renderHistoryChips("groupHistory", groupHistory, "groupInput");
    }

    function renderHistoryChips(boxId, items, inputId) {
      const box = document.getElementById(boxId);
      box.innerHTML = items.slice(0, 12).map(item => `
        <span class="chip" onclick="fillInput('${inputId}', '${escapeJs(item)}')">${escapeHtml(item)}</span>
      `).join("");
    }

    function fillInput(inputId, value) {
      document.getElementById(inputId).value = value;
    }

    function addHistory(type, value) {
      value = String(value || "").trim();
      if (!value) return;

      if (type === "group") {
        groupHistory = [value, ...groupHistory.filter(x => x !== value)].slice(0, 30);
        saveHistory("plate_group_history", groupHistory);
      } else {
        geneHistory = unique([...geneHistory, value]).slice(0, 60);
        saveHistory("plate_gene_history", geneHistory);

        if (!geneCatalog.some(item => item.name === value)) {
          geneCatalog.push({
            name: value,
            hue: GENE_HUES[geneCatalog.length % GENE_HUES.length]
          });
          saveGeneCatalog();
        }
      }
    }

    function renderLegend(id) {
      const items = Object.values(assignments).filter(hasContent);
      const box = document.getElementById(id);

      if (!items.length) {
        box.innerHTML = "";
        return;
      }

      const usedGenes = new Set(items.map(x => x.gene).filter(Boolean));
      let html = "";

      geneCatalog.forEach(entry => {
        if (!usedGenes.has(entry.name)) return;
        const groups = unique(items.filter(x => x.gene === entry.name).map(x => x.group));
        if (!groups.length) groups.push("");

        groups.forEach(group => {
          const temp = { gene: entry.name, group };
          html += `
            <div class="legend-item">
              <span class="legend-dot" style="background:${colorForItem(temp)}"></span>
              <span>${escapeHtml(entry.name)} / ${escapeHtml(group || "-")}</span>
            </div>
          `;
        });
      });

      box.innerHTML = html;
    }

    function showDetail(well, type, displayWell) {
      const item = assignments[well];
      if (!hasContent(item)) return;

      const shownWell = displayWell || well;
      const card = document.getElementById("detailCard");

      if (type === "rotated") {
        document.getElementById("detailTitle").textContent = `旋转180°：${shownWell}`;
        document.getElementById("detailBody").innerHTML = `
          组别 / 样本：<b>${escapeHtml(item.group || "-")}</b><br>
          目标基因：<b>${escapeHtml(item.gene || "-")}</b><br>
          对应正向孔：<b>${escapeHtml(well)}</b>
        `;
      } else {
        document.getElementById("detailTitle").textContent = `正向：${well}`;
        document.getElementById("detailBody").innerHTML = `
          组别 / 样本：<b>${escapeHtml(item.group || "-")}</b><br>
          目标基因：<b>${escapeHtml(item.gene || "-")}</b><br>
          旋转后显示为：<b>${escapeHtml(item.rotatedWell)}</b>
        `;
      }

      card.className = "detail-card show";
    }

    function rotateWell(well) {
      const row = well[0];
      const col = well.slice(1);
      const r = ROWS.indexOf(row);
      const c = COLS.indexOf(col);
      return ROWS[7 - r] + COLS[11 - c];
    }

    function sourceWellForView(displayWell, type) {
      return type === "rotated" ? rotateWell(displayWell) : displayWell;
    }


    function getGeneHue(gene) {
      const idx = geneCatalog.findIndex(item => item.name === gene);
      if (idx >= 0) return geneCatalog[idx].hue;
      const fallbackIndex = Math.max(0, DEFAULT_GENES.indexOf(gene));
      return GENE_HUES[fallbackIndex % GENE_HUES.length];
    }

    function geneBaseColor(gene) {
      return `hsl(${getGeneHue(gene)}, 76%, 72%)`;
    }

    function colorForItem(item) {
      const gene = item.gene || "__未设基因__";
      const group = item.group || "__未设组别__";
      const hue = gene === "__未设基因__" ? 210 : getGeneHue(gene);

      const groupsInGene = unique(
        Object.values(assignments)
          .filter(x => hasContent(x) && (x.gene || "__未设基因__") === gene)
          .map(x => x.group || "__未设组别__")
      );

      const groupIndex = Math.max(0, groupsInGene.indexOf(group));
      const lightnessSteps = [84, 74, 64, 54, 44, 79, 69, 59, 49, 39];
      const lightness = lightnessSteps[groupIndex % lightnessSteps.length];
      return `hsl(${hue}, 76%, ${lightness}%)`;
    }

    function sanitizeFilenamePart(text) {
      return String(text || "")
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildPlateExportBasename(type) {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const datePart =
        String(now.getFullYear()).slice(-2) +
        pad(now.getMonth() + 1) +
        pad(now.getDate());

      const groups = unique(
        Object.values(assignments)
          .filter(hasContent)
          .map(item => String(item.group || "").trim())
          .filter(Boolean)
      );

      const groupPart = groups.length
        ? groups.map(sanitizeFilenamePart).join("、")
        : "未设组别";

      const viewPart = type === "normal" ? "正向" : "旋转180";

      return `96孔板图-${datePart}-${groupPart}-${viewPart}`;
    }

    function buildPlateExportFilename(type, format) {
      const ext = String(format || "png").toLowerCase();
      return `${buildPlateExportBasename(type)}.${ext}`;
    }

    function getPlateExportNode(type) {
      const wrap = document.getElementById(type === "normal" ? "plateNormalWrap" : "plateRotatedWrap");
      const plateScroll = wrap ? wrap.querySelector(".plate-scroll") : null;
      const plateGrid = wrap ? wrap.querySelector(".plate-grid") : null;

      if (!wrap || !plateScroll || !plateGrid) {
        throw new Error("未找到可导出的孔板区域");
      }

      const scrollRect = plateScroll.getBoundingClientRect();
      const gridRect = plateGrid.getBoundingClientRect();

      const exportCard = document.createElement("div");
      exportCard.className = "plate-card";
      exportCard.style.width = `${Math.ceil(Math.max(scrollRect.width, gridRect.width))}px`;
      exportCard.style.boxSizing = "border-box";
      exportCard.style.background = "#ffffff";
      exportCard.style.padding = "8px";
      exportCard.style.border = "1px solid var(--border)";
      exportCard.style.borderRadius = "14px";
      exportCard.style.boxShadow = "var(--shadow)";
      exportCard.style.display = "flex";
      exportCard.style.flexDirection = "column";
      exportCard.style.gap = "0";

      const title = document.createElement("div");
      title.className = "export-image-title";
      title.textContent = buildPlateExportBasename(type);

      const scrollClone = plateScroll.cloneNode(true);
      scrollClone.style.width = `${Math.ceil(scrollRect.width)}px`;
      scrollClone.style.overflow = "visible";
      scrollClone.style.display = "flex";
      scrollClone.style.justifyContent = "center";
      scrollClone.style.alignItems = "flex-start";
      scrollClone.style.paddingBottom = "0";

      const gridClone = scrollClone.querySelector(".plate-grid");
      if (gridClone) {
        gridClone.style.width = `${Math.ceil(gridRect.width)}px`;
        gridClone.style.maxWidth = "none";
        gridClone.style.minWidth = "0";
        gridClone.style.margin = "0 auto";
      }

      exportCard.appendChild(title);
      exportCard.appendChild(scrollClone);

      return exportCard;
    }

    function buildPlateSvg(type) {
      const exportNode = getPlateExportNode(type);

      const stage = document.createElement("div");
      stage.style.position = "fixed";
      stage.style.left = "-10000px";
      stage.style.top = "0";
      stage.style.zIndex = "-1";
      stage.style.background = "#ffffff";
      stage.style.padding = "0";
      stage.appendChild(exportNode);
      document.body.appendChild(stage);

      const rect = exportNode.getBoundingClientRect();
      const width = Math.max(1, Math.ceil(rect.width));
      const height = Math.max(1, Math.ceil(rect.height));

      const styleText = (document.querySelector("style")?.textContent || "") + `
        .legend { display: none !important; }
        .plate-head, .plate-actions, .view-tabs { display: none !important; }
        body {
          margin: 0;
          background: #ffffff;
          font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
        }
      `;

      const xhtml = `
        <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;background:#ffffff;">
          <style>${styleText}</style>
          ${exportNode.outerHTML}
        </div>
      `;

      document.body.removeChild(stage);

      const svg =
        `<?xml version="1.0" encoding="UTF-8"?>` +
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">` +
        `<foreignObject width="100%" height="100%">${xhtml}</foreignObject>` +
        `</svg>`;

      return { svg, width, height };
    }

    function canvasRoundedRect(ctx, x, y, width, height, radius) {
      const r = Math.max(0, Math.min(radius || 0, width / 2, height / 2));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function cssPx(value, fallback = 0) {
      const n = parseFloat(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function drawDomTextToCanvas(ctx, element, rootRect, offsetX, offsetY) {
      if (!element) return;

      const value = String(element.textContent || "");
      if (!value) return;

      const rect = element.getBoundingClientRect();
      const style = getComputedStyle(element);

      const x = offsetX + (rect.left - rootRect.left);
      const y = offsetY + (rect.top - rootRect.top);
      const width = Math.max(1, rect.width);
      const height = Math.max(1, rect.height);

      const fontSize = cssPx(style.fontSize, 10);
      const fontWeight = style.fontWeight || "400";
      const fontFamily = style.fontFamily || 'Arial, "Microsoft YaHei", sans-serif';

      ctx.save();
      ctx.fillStyle = style.color || "#111827";
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      ctx.textBaseline = "middle";

      const align = style.textAlign;
      let drawX = x;
      let textAlign = "left";

      if (align === "center") {
        drawX = x + width / 2;
        textAlign = "center";
      } else if (align === "right" || align === "end") {
        drawX = x + width;
        textAlign = "right";
      }

      ctx.textAlign = textAlign;

      // 使用 maxWidth 保证长基因名完整落在当前 DOM 实际宽度内。
      ctx.fillText(value, drawX, y + height / 2, width);
      ctx.restore();
    }

    function drawPlateElementToCanvas(ctx, element, rootRect, offsetX, offsetY) {
      const rect = element.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const style = getComputedStyle(element);
      const x = offsetX + (rect.left - rootRect.left);
      const y = offsetY + (rect.top - rootRect.top);
      const width = rect.width;
      const height = rect.height;
      const radius = cssPx(style.borderRadius, 0);

      ctx.save();

      const bg = style.backgroundColor;
      if (
        bg &&
        bg !== "rgba(0, 0, 0, 0)" &&
        bg !== "transparent"
      ) {
        canvasRoundedRect(ctx, x, y, width, height, radius);
        ctx.fillStyle = bg;
        ctx.fill();
      }

      const borderWidth = Math.max(
        cssPx(style.borderTopWidth, 0),
        cssPx(style.borderRightWidth, 0),
        cssPx(style.borderBottomWidth, 0),
        cssPx(style.borderLeftWidth, 0)
      );

      const borderColor = style.borderTopColor;
      if (borderWidth > 0 && borderColor && borderColor !== "rgba(0, 0, 0, 0)") {
        canvasRoundedRect(
          ctx,
          x + borderWidth / 2,
          y + borderWidth / 2,
          Math.max(0, width - borderWidth),
          Math.max(0, height - borderWidth),
          Math.max(0, radius - borderWidth / 2)
        );
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;
        ctx.stroke();
      }

      // 当前孔位若仍处于选中状态，也按浏览器里的蓝色 outline 绘制。
      if (element.classList.contains("selected")) {
        const outlineWidth = cssPx(style.outlineWidth, 3);
        const outlineColor = style.outlineColor || "#2563eb";
        const inset = Math.max(0, outlineWidth / 2 + 1);

        canvasRoundedRect(
          ctx,
          x + inset,
          y + inset,
          Math.max(0, width - inset * 2),
          Math.max(0, height - inset * 2),
          Math.max(0, radius - inset)
        );
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = outlineWidth;
        ctx.stroke();
      }

      ctx.restore();

      if (element.classList.contains("axis-label")) {
        drawDomTextToCanvas(ctx, element, rootRect, offsetX, offsetY);
        return;
      }

      if (element.classList.contains("well")) {
        const wellId = element.querySelector(".well-id");
        const wellMain = element.querySelector(".well-main");
        const wellSub = element.querySelector(".well-sub");

        drawDomTextToCanvas(ctx, wellId, rootRect, offsetX, offsetY);
        drawDomTextToCanvas(ctx, wellMain, rootRect, offsetX, offsetY);
        drawDomTextToCanvas(ctx, wellSub, rootRect, offsetX, offsetY);
      }
    }

    function renderPlateToPngCanvas(type) {
      const grid = document.getElementById(
        type === "normal" ? "plateNormal" : "plateRotated"
      );

      if (!grid) {
        throw new Error("未找到孔板区域");
      }

      const gridRect = grid.getBoundingClientRect();
      if (!gridRect.width || !gridRect.height) {
        throw new Error("当前孔板区域不可见，无法导出 PNG");
      }

      const outerPadding = 8;
      const titleHeight = 34;
      const titleGap = 5;
      const cssWidth = Math.ceil(gridRect.width + outerPadding * 2);
      const cssHeight = Math.ceil(
        gridRect.height + outerPadding * 2 + titleHeight + titleGap
      );

      // 2 倍像素密度，保证导出的文字和边缘清晰。
      const pixelRatio = Math.max(
        2,
        Math.min(3, Number(window.devicePixelRatio) || 1)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(cssWidth * pixelRatio);
      canvas.height = Math.ceil(cssHeight * pixelRatio);

      const ctx = canvas.getContext("2d");
      ctx.scale(pixelRatio, pixelRatio);

      // 与浏览器右侧卡片一致的白色背景。
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      // 外卡片边框。
      canvasRoundedRect(
        ctx,
        0.5,
        0.5,
        cssWidth - 1,
        cssHeight - 1,
        14
      );
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      ctx.stroke();

      // 标题沿用文件名主体，不带扩展名。
      ctx.fillStyle = "#0f172a";
      ctx.font = '900 15px Arial, "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(
        buildPlateExportBasename(type),
        cssWidth / 2,
        outerPadding + titleHeight / 2,
        cssWidth - outerPadding * 2
      );

      const offsetX = outerPadding;
      const offsetY = outerPadding + titleHeight + titleGap;

      Array.from(grid.children).forEach(element => {
        drawPlateElementToCanvas(
          ctx,
          element,
          gridRect,
          offsetX,
          offsetY
        );
      });

      return canvas;
    }

    function downloadPlate(type, format) {
      if (Object.keys(assignments).filter(k => hasContent(assignments[k])).length === 0) {
        showMessage("请先分配孔位");
        return;
      }

      const exportData = buildPlateSvg(type);

      if (format === "svg") {
        downloadText(
          exportData.svg,
          buildPlateExportFilename(type, "svg"),
          "image/svg+xml;charset=utf-8"
        );
        return;
      }

      try {
        const canvas = renderPlateToPngCanvas(type);

        canvas.toBlob(blob => {
          if (!blob) {
            showMessage("PNG 生成失败，请重试");
            return;
          }

          const a = document.createElement("a");
          const url = URL.createObjectURL(blob);

          a.href = url;
          a.download = buildPlateExportFilename(type, "png");
          document.body.appendChild(a);
          a.click();
          a.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showMessage("");
        }, "image/png");
      } catch (err) {
        showMessage(
          "PNG 导出失败：" +
          (err && err.message ? err.message : "未知错误")
        );
      }
    }

    function hasContent(item) {
      return item && (String(item.group || "").trim() || String(item.gene || "").trim());
    }

    function downloadText(text, filename, mime) {
      const blob = new Blob([text], {type: mime});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function unique(arr) {
      return Array.from(new Set(arr.filter(x => String(x || "").trim() !== "")));
    }

    function shortText(text, maxLen) {
      text = String(text);
      return text.length > maxLen ? text.slice(0, maxLen) : text;
    }

    function loadHistory(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function saveHistory(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function showMessage(text) {
      document.getElementById("messageBox").textContent = text || "";
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[ch]));
    }

    function escapeJs(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }

    function escapeXml(str) {
      return String(str).replace(/[&<>'"]/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&apos;",
        '"': "&quot;"
      }[ch]));
    }

    const newGroupInputEl = document.getElementById("newGroupInput");
    const newGeneInputEl = document.getElementById("newGeneInput");

    if (newGroupInputEl) {
      newGroupInputEl.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addGroupToCatalog();
        }
      });
    }

    if (newGeneInputEl) {
      newGeneInputEl.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addGeneToCatalog();
        }
      });
    }

    renderAll();
    initPyodideRuntime();
  </script>
</body>
</html>
