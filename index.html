 function fetchTime(ep){return new Promise(function(resolve,reject){if(typeof fetch!=='function'){reject(new Error('no fetch'));return}var ctrl=typeof AbortController!=='undefined'?new AbortController():null;var tm=setTimeout(function(){if(ctrl)ctrl.abort();reject(new Error('timeout'))},2600);fetch(ep.u,{cache:'no-store',signal:ctrl?ctrl.signal:undefined}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){var x=JSON.parse(t),ms=ep.p(x);if(!Number.isFinite(ms)||ms<1600000000000)throw new Error('bad time');clearTimeout(tm);resolve({ms:ms,source:ep.n})}).catch(function(e){clearTimeout(tm);reject(e)})})}
 function firstSuccess(arr){return new Promise(function(resolve,reject){var left=arr.length,last=null;if(!left){reject(new Error('no time source'));return}arr.forEach(function(p){Promise.resolve(p).then(resolve).catch(function(e){last=e;left--;if(!left)reject(last||new Error('all failed'))})})})}
 function getTrustedTime(force){var local=Date.now(),last=Number(C.sget(LAST_KEY)||0)||0,cached=null;try{cached=JSON.parse(C.sget(TRUST_KEY)||'null')}catch(e){}if(!force&&cached&&Number.isFinite(cached.serverMs)&&Number.isFinite(cached.localMs)){var el=local-cached.localMs;if(el>=-600000&&el<7*86400000){var cm=Math.max(cached.serverMs+Math.max(0,el),local,last);C.sset(LAST_KEY,String(cm));return Promise.resolve({ms:cm,source:(cached.source||'网络时间')+'（缓存）'})}}if(!force){var lm=Math.max(local,last);C.sset(LAST_KEY,String(lm));return Promise.resolve({ms:lm,source:'设备时间/防回拨'})}return firstSuccess(EPS.map(fetchTime)).then(function(g){var ms=Math.max(g.ms,local,last);C.sset(TRUST_KEY,JSON.stringify({serverMs:ms,localMs:Date.now(),source:g.source,syncedAt:Date.now()}));C.sset(LAST_KEY,String(ms));return {ms:ms,source:g.source}}).catch(function(){if(cached&&Number.isFinite(cached.serverMs)&&Number.isFinite(cached.localMs)){var el2=local-cached.localMs,cm2=Math.max(cached.serverMs+Math.max(0,el2),local,last);C.sset(LAST_KEY,String(cm2));return {ms:cm2,source:'最近可信时间（离线）'}}var lm2=Math.max(local,last);C.sset(LAST_KEY,String(lm2));return {ms:lm2,source:'设备时间（网络校时不可用）'}})}
 function verifyLicense(code,now){return new Promise(function(resolve,reject){try{if(!window.crypto||!crypto.subtle)throw new Error('当前浏览器不支持 WebCrypto，无法验证授权');if(!code||code.indexOf(LP)!==0)throw new Error('授权码格式不正确');var ps=code.split('.');if(ps.length!==3)throw new Error('授权码结构不正确');var pb=unb64u(ps[1]),sig=unb64u(ps[2]);crypto.subtle.importKey('jwk',PUBLIC_JWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(key){return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sig,pb)}).then(function(ok){if(!ok)throw new Error('授权签名无效');var p=JSON.parse(unutf8(pb));if(p.productId!==META.productId)throw new Error('授权不属于当前产品');if(p.releaseId!==META.releaseId)throw new Error('授权发行号与当前版本不一致');if(p.bundleHash!==BUNDLE.hash)throw new Error('授权与当前发行包不匹配');if(p.keyId!==META.keyId)throw new Error('授权发行密钥不匹配');if(p.deviceId!==C.getDeviceId())throw new Error('授权与当前设备解锁码不匹配');if(!Number.isFinite(p.expiresAt)||now>=p.expiresAt*1000)throw new Error('授权已过期');if(!p.contentKey)throw new Error('授权缺少内容密钥');resolve(p)}).catch(reject)}catch(e){reject(e)}})}
 function sha256b64(bytes){return crypto.subtle.digest('SHA-256',bytes).then(b64u)}
 function decryptSource(p){if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('当前浏览器不支持 WebCrypto，无法解密程序'));return crypto.subtle.importKey('raw',unb64u(p.contentKey),{name:'AES-GCM'},false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(BUNDLE.iv)},k,unb64u(BUNDLE.cipher))}).then(function(plain){var a=new Uint8Array(plain);return sha256b64(a).then(function(h){if(BUNDLE.sourceHash&&h!==BUNDLE.sourceHash)throw new Error('程序完整性校验失败');return unutf8(a)})})}
 function makeRenew(){var lic=C.sget(C.LICENSE_KEY)||'';var p={v:1,type:'renew',productId:META.productId,releaseId:META.releaseId,appVersion:META.appVersion,bundleHash:BUNDLE.hash,keyId:META.keyId,deviceId:C.getDeviceId(),license:lic};return RP+b64u(utf8(JSON.stringify(p)))}
 function showGate(reason,expired,canCancel){document.getElementById('licenseGate').className='gate';document.getElementById('appFrame').className='frame hidden';document.getElementById('expiryBanner').className='expiry hidden';var n=document.getElementById('gateNotice');if(reason){n.textContent=reason;n.className='notice bad'}else n.className='notice hidden';document.getElementById('requestArea').className=expired?'hidden':'';document.getElementById('renewArea').className=expired?'':'hidden';if(expired){try{document.getElementById('renewCode').textContent=makeRenew()}catch(e){document.getElementById('renewCode').textContent='续期请求码生成失败：'+errText(e)}}document.getElementById('cancelRenewBtn').className=canCancel?'btn':'btn hidden';document.getElementById('licenseInput').value='';document.getElementById('gateStatus').textContent='';document.getElementById('activateBtn').disabled=false;appRunning=false}
 function fmt(ms){try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms))}catch(e){return new Date(ms).toLocaleString()}}
 function setupWarning(){var b=document.getElementById('expiryBanner');if(!currentLicense||META.launchMode!=='iframe'){b.className='expiry hidden';return}var remain=currentLicense.expiresAt*1000-liveNow(),days=Math.ceil(remain/86400000);if(days<=Number(META.warningDays||7)&&remain>0){document.getElementById('expiryText').textContent='授权将于 '+fmt(currentLicense.expiresAt*1000)+' 到期，剩余约 '+Math.max(0,days)+' 天。';b.className='expiry'}else b.className='expiry hidden'}
 function watchExpiry(){clearTimeout(timer);if(META.launchMode!=='iframe'||!currentLicense)return;timeBase=currentNow;perfBase=(window.performance&&performance.now)?performance.now():Date.now();function ck(){var remain=currentLicense.expiresAt*1000-liveNow();if(remain<=0){currentNow=liveNow();showGate('当前授权已到期，请续期后继续使用。',true,false);return}setupWarning();timer=setTimeout(ck,Math.min(60000,Math.max(500,remain+50)))}ck()}
 function launch(source){currentSource=source;if(META.launchMode==='top'){C.sset('HZC_LAST_LAUNCH_'+META.productId+'_'+META.releaseId,String(Date.now()));document.open();document.write(source);document.close();return}var f=document.getElementById('appFrame');f.srcdoc=source;f.className='frame';document.getElementById('licenseGate').className='gate hidden';appRunning=true;setupWarning();watchExpiry()}
 function enterWithLicense(p,now,source){currentLicense=p;currentNow=now;launch(source)}
 function activate(){var btn=document.getElementById('activateBtn'),st=document.getElementById('gateStatus'),code=document.getElementById('licenseInput').value.trim();btn.disabled=true;st.textContent='正在校验时间、授权并解密程序…';getTrustedTime(true).then(function(t){return verifyLicense(code,t.ms).then(function(p){return decryptSource(p).then(function(src){C.sset(C.LICENSE_KEY,code);enterWithLicense(p,t.ms,src)})})}).catch(function(e){window.__HZC_LAST_ERROR__=errText(e);st.textContent='验证失败：'+errText(e);btn.disabled=false})}
 function bootstrap(){if(!BUNDLE||!BUNDLE.cipher){showGate('当前文件没有有效的加密程序载荷。',false,false);return}var code=C.sget(C.LICENSE_KEY);if(!code){showGate('',false,false);return}getTrustedTime(false).then(function(t){return verifyLicense(code,t.ms).then(function(p){return decryptSource(p).then(function(src){enterWithLicense(p,t.ms,src)})})}).catch(function(e){var m=errText(e);if(m.indexOf('已过期')>=0)showGate('当前授权已到期，请续期后继续使用。',true,false);else showGate('已有授权无法使用：'+m,false,false)})}
 document.getElementById('activateBtn').onclick=activate;
 document.getElementById('copyRenewBtn').onclick=function(){var t='发行号：'+META.releaseId+'\n续期请求码：'+makeRenew();C.copy(t,function(ok){document.getElementById('gateStatus').textContent=ok?'续期请求码已复制。':'自动复制失败，请手动复制。'})};
 document.getElementById('copyRenewTopBtn').onclick=function(){var t='发行号：'+META.releaseId+'\n续期请求码：'+makeRenew();C.copy(t,function(){})};
 document.getElementById('renewInputTopBtn').onclick=function(){showGate('',true,true)};
 document.getElementById('cancelRenewBtn').onclick=function(){if(!currentLicense)return;var now=liveNow();if(now>=currentLicense.expiresAt*1000){showGate('当前授权已到期，请续期后继续使用。',true,false);return}document.getElementById('licenseGate').className='gate hidden';document.getElementById('appFrame').className='frame';appRunning=true;setupWarning();watchExpiry()};
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&currentLicense&&META.launchMode==='iframe'&&liveNow()>=currentLicense.expiresAt*1000)showGate('当前授权已到期，请续期后继续使用。',true,false)});window.addEventListener('focus',function(){if(currentLicense&&META.launchMode==='iframe'&&liveNow()>=currentLicense.expiresAt*1000)showGate('当前授权已到期，请续期后继续使用。',true,false)});
 bootstrap();
})();
</script>
